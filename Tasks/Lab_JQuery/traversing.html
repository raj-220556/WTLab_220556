<body>
    <h2>DOM Traversing</h2>
<div class="ancestor">
    <div style="width:500px;">div (great-grandparent)
        <ul>ul (grandparent)  
            <li>li (direct parent)
                <span>span (child)</span>
            </li>
        </ul>   
    </div>
</div>
<button id="btn-traverse">Traverse Up/Down</button>
</body>
